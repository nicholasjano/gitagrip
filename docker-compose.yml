services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - '4000:4000'
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gitagrip:gitagrip@postgres:5432/gitagrip
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: node dist/worker/index.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gitagrip:gitagrip@postgres:5432/gitagrip
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "const net=require(\"node:net\");const s=net.createConnection({host:\"redis\",port:6379},()=>{s.end();process.exit(0)});s.on(\"error\",()=>process.exit(1));setTimeout(()=>process.exit(1),2000);"',
        ]
      interval: 15s
      timeout: 5s
      retries: 3
    mem_limit: 2g
    restart: unless-stopped

  postgres:
    image: postgres:18
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=gitagrip
      - POSTGRES_PASSWORD=gitagrip
      - POSTGRES_DB=gitagrip
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gitagrip']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8.0.5
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
