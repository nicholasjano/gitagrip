upstream nextjs {
    server web:3000;
}

upstream express {
    server api:4000;
}

limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=20r/s;

server {
    listen 80;
    client_max_body_size 100k;

    # if tls terminates upstream, configure trusted proxies with set_real_ip_from
    # and use the forwarded chain as the canonical client ip.
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        limit_req zone=api_rate_limit burst=40 nodelay;
        proxy_pass http://express/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /_next/static {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
